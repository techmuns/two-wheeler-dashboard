name: Fetch + extract PDF text

# Downloads a publicly-accessible PDF on the runner, extracts the layout
# text, and commits the .txt (and optional .json sections) -- but never
# the PDF itself. Solves the 100 MB / LFS-per-file repo size limit for
# large investor documents like the Ola DRHP (~50 MB).
#
# Triggers:
#   1. Manual button in Actions (workflow_dispatch)
#   2. Push to .github/fetch-queue.json with the URL + filename slug
#
# After the run lands, the assistant can read the extracted .txt file
# from src/data/source-text/<slug>.txt and parse cells into the company
# JSON exactly the same way TVS was processed locally.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Direct PDF URL (publicly accessible)'
        required: true
        default: 'https://www.sebi.gov.in/sebi_data/attachdocs/dec-2023/1703580725954.PDF'
      slug:
        description: 'Slug to save extracted text as (no extension), e.g. OLA_DRHP -> src/data/source-text/OLA_DRHP.txt'
        required: true
        default: 'OLA_DRHP'
  push:
    paths:
      - '.github/fetch-queue.json'

permissions:
  contents: write

concurrency:
  group: fetch-pdf
  cancel-in-progress: false

jobs:
  fetch-and-extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install poppler-utils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -v 2>&1 | head -1

      - name: Resolve URL + slug
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL='${{ inputs.url }}'
            SLUG='${{ inputs.slug }}'
          else
            if [ ! -f .github/fetch-queue.json ]; then
              echo "::error::Push trigger fired but .github/fetch-queue.json is missing."
              exit 1
            fi
            URL=$(jq -r '.url' .github/fetch-queue.json)
            # Accept either 'slug' or 'filename' (strip .pdf if filename was used)
            SLUG=$(jq -r '.slug // (.filename | sub("\\.[Pp][Dd][Ff]$"; ""))' .github/fetch-queue.json)
          fi
          # Strict sanity-check on the slug.
          if ! echo "$SLUG" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "::error::Slug must be [A-Za-z0-9_-]+ (got: $SLUG)"; exit 1
          fi
          echo "URL=$URL"   >> "$GITHUB_OUTPUT"
          echo "SLUG=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Fetching: $URL"
          echo "Will save: src/data/source-text/$SLUG.txt"

      - name: Download PDF to /tmp (never to repo)
        env:
          URL:  ${{ steps.resolve.outputs.URL }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dl
          curl -L --fail -sS \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -H "Accept: application/pdf,application/octet-stream,*/*" \
            -o /tmp/dl/in.pdf "$URL"
          file /tmp/dl/in.pdf
          if ! file /tmp/dl/in.pdf | grep -qi 'PDF document'; then
            echo "::error::Downloaded file is not a PDF (check the URL)."
            head -c 500 /tmp/dl/in.pdf | hexdump -C | head -5
            exit 1
          fi
          SIZE=$(stat -c%s /tmp/dl/in.pdf)
          echo "Downloaded $SIZE bytes."

      - name: Extract layout text + page count
        env:
          SLUG: ${{ steps.resolve.outputs.SLUG }}
        run: |
          set -euo pipefail
          mkdir -p src/data/source-text
          OUT="src/data/source-text/$SLUG.txt"

          # -layout preserves table column alignment which is what the
          # downstream parser keys off. No -enc utf8 needed; default is utf-8.
          pdftotext -layout /tmp/dl/in.pdf "$OUT"
          pdfinfo /tmp/dl/in.pdf > "src/data/source-text/$SLUG.meta.txt" || true

          LINES=$(wc -l < "$OUT")
          BYTES=$(stat -c%s "$OUT")
          echo "Extracted: $LINES lines, $BYTES bytes -> $OUT"
          echo "$OUT_BYTES_LINES=$LINES" >> "$GITHUB_STEP_SUMMARY" || true

          # If even the text file is too big for git (>20 MB), gzip it.
          if [ "$BYTES" -gt 20971520 ]; then
            gzip -9 "$OUT"
            echo "Compressed to ${OUT}.gz"
          fi

      - name: Commit extracted text (PDF stays on runner, never committed)
        env:
          SLUG: ${{ steps.resolve.outputs.SLUG }}
          URL:  ${{ steps.resolve.outputs.URL }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/source-text/
          if git diff --staged --quiet; then
            echo "No changes -- extracted text matches existing."
            exit 0
          fi
          git commit -m "data: extract text from $SLUG via Actions

Source URL: $URL
Extracted:  src/data/source-text/$SLUG.txt
Note: PDF is fetched to runner /tmp and discarded after extraction.
      Only the layout-preserving text + pdfinfo metadata is committed.
"
          git push
