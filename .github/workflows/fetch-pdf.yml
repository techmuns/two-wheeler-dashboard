name: Fetch PDF (annual report / DRHP)

# Two ways to trigger:
#   1. Manual button click in Actions tab (workflow_dispatch)
#   2. Push to .github/fetch-queue.json with the URL + filename
# Method 2 lets the assistant queue a fetch without needing a workflow_run
# permission. Whoever pushes the queue file owns the fetch.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Direct PDF URL (must end in .pdf or .PDF and be publicly accessible)'
        required: true
        default: 'https://www.sebi.gov.in/sebi_data/attachdocs/dec-2023/1703580725954.PDF'
      filename:
        description: 'Save as this filename (recommended: <COMPANY>_<DOC>.pdf, e.g. OLA_DRHP.pdf)'
        required: true
        default: 'OLA_DRHP.pdf'
  push:
    paths:
      - '.github/fetch-queue.json'

permissions:
  contents: write

concurrency:
  group: fetch-pdf
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve URL + filename from event
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            URL='${{ inputs.url }}'
            NAME='${{ inputs.filename }}'
          else
            if [ ! -f .github/fetch-queue.json ]; then
              echo "::error::Push trigger fired but .github/fetch-queue.json is missing."
              exit 1
            fi
            URL=$(jq -r '.url'      .github/fetch-queue.json)
            NAME=$(jq -r '.filename' .github/fetch-queue.json)
          fi
          echo "URL=$URL"   >> "$GITHUB_OUTPUT"
          echo "NAME=$NAME" >> "$GITHUB_OUTPUT"
          echo "Fetching: $URL  ->  $NAME"

      - name: Download PDF
        env:
          URL:  ${{ steps.resolve.outputs.URL }}
          NAME: ${{ steps.resolve.outputs.NAME }}
        run: |
          set -euo pipefail
          if ! echo "$NAME" | grep -qiE '\.pdf$'; then
            echo "::error::Filename must end in .pdf (got: $NAME)"; exit 1
          fi
          if [ -f "$NAME" ]; then
            echo "::warning::File $NAME already exists; will overwrite."
          fi
          echo "Fetching $URL"
          curl -L --fail -sS \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -H "Accept: application/pdf,application/octet-stream,*/*" \
            -o "$NAME" "$URL"
          file "$NAME"
          if ! file "$NAME" | grep -qi 'PDF document'; then
            echo "::error::Downloaded file is not a PDF (check the URL)."
            head -c 500 "$NAME" | hexdump -C | head -5
            exit 1
          fi
          SIZE=$(stat -c%s "$NAME")
          echo "Downloaded $SIZE bytes to $NAME"
          ls -la "$NAME"

      - name: Commit the PDF (LFS if > 25 MB)
        env:
          NAME: ${{ steps.resolve.outputs.NAME }}
          URL:  ${{ steps.resolve.outputs.URL }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install >/dev/null 2>&1 || true
          SIZE=$(stat -c%s "$NAME")
          if [ "$SIZE" -gt 26214400 ]; then
            echo "File is $SIZE bytes; tracking with Git LFS."
            git lfs track "*.pdf" || true
            git add .gitattributes || true
          fi
          git add "$NAME"
          if git diff --staged --quiet; then
            echo "No changes -- file already matches what's in the repo."
            exit 0
          fi
          git commit -m "data: fetch $NAME via Actions

Source: $URL
Bytes:  $SIZE
Fetched: $(date -u +%Y-%m-%dT%H:%M:%SZ)
"
          git push
