name: Fetch PDF (annual report / DRHP)

# Downloads a publicly-accessible PDF from a URL and commits it to the repo
# root. Designed so any company's investor PDF (annual report, DRHP, Q4 deck)
# can be ingested with one click from the GitHub Actions tab.
#
# Defaults populated for the Ola Electric DRHP (Dec 2023, ~50 MB) so the
# first run is just 'click button'.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Direct PDF URL (must end in .pdf or .PDF and be publicly accessible)'
        required: true
        default: 'https://www.sebi.gov.in/sebi_data/attachdocs/dec-2023/1703580725954.PDF'
      filename:
        description: 'Save as this filename (recommended: <COMPANY>_<DOC>.pdf, e.g. OLA_DRHP.pdf)'
        required: true
        default: 'OLA_DRHP.pdf'

permissions:
  contents: write

concurrency:
  group: fetch-pdf
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PDF
        env:
          URL:  ${{ inputs.url }}
          NAME: ${{ inputs.filename }}
        run: |
          set -euo pipefail

          # Refuse if the filename doesn't end in .pdf (case-insensitive).
          if ! echo "$NAME" | grep -qiE '\.pdf$'; then
            echo "::error::Filename must end in .pdf (got: $NAME)"
            exit 1
          fi

          # Refuse to overwrite an existing file unless it's a previous download.
          if [ -f "$NAME" ]; then
            echo "::warning::File $NAME already exists; will overwrite."
          fi

          echo "Fetching $URL"
          # -L follow redirects, -sS quiet but show errors, -A real UA to bypass
          # SEBI's bot heuristics, -o write to file, fail on HTTP error.
          curl -L --fail -sS \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -H "Accept: application/pdf,application/octet-stream,*/*" \
            -o "$NAME" "$URL"

          # Sanity-check: must be a real PDF.
          file "$NAME"
          if ! file "$NAME" | grep -qi 'PDF document'; then
            echo "::error::Downloaded file is not a PDF (check the URL)."
            head -c 500 "$NAME" | hexdump -C | head -5
            exit 1
          fi

          SIZE=$(stat -c%s "$NAME")
          echo "Downloaded $SIZE bytes to $NAME"
          ls -la "$NAME"

      - name: Commit the PDF
        env:
          NAME: ${{ inputs.filename }}
          URL:  ${{ inputs.url }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install >/dev/null 2>&1 || true
          # Use Git LFS for files > 25 MB so we don't blow past GitHub's 100MB limit.
          SIZE=$(stat -c%s "$NAME")
          if [ "$SIZE" -gt 26214400 ]; then
            echo "File is $SIZE bytes; tracking with Git LFS."
            git lfs track "*.pdf" || true
            git add .gitattributes || true
          fi
          git add "$NAME"
          if git diff --staged --quiet; then
            echo "No changes -- file already matches what's in the repo."
            exit 0
          fi
          git commit -m "data: fetch $NAME via Actions

Source: $URL
Bytes:  $SIZE
Fetched: $(date -u +%Y-%m-%dT%H:%M:%SZ)
"
          git push
